# ==============================================================================
# Nginx 靜態伺服器設定檔 (nginx.conf)
# ==============================================================================
# 說明：
#   1. 託管 Vue 3 打包後的靜態網頁 (HTML/JS/CSS)。
#   2. 支援 SPA 路由重導向 (try_files $uri $uri/ /index.html)。
#   3. 啟用 Gzip 壓縮提升網頁載入速度。
# ==============================================================================

server {
    listen       80;
    server_name  localhost;

    # 網頁根目錄
    root   /usr/share/nginx/html;
    index  index.html;

    # 啟用 Gzip 壓縮以減少網路傳輸量
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA 單頁式應用路由支援：若找不到實體檔案，則導回 index.html 由 Vue Router / 前端處理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 錯誤頁面處理
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
